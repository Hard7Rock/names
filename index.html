<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій новий сайт</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #0f172a;
    }

    p {
      color: #475569;
      margin-bottom: 24px;
      font-size: 1rem;
    }

    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>Привіт, світе! 🚀</h1>
    <p>Це проста стартова сторінка, готову для публікації на GitHub Pages.</p>
    <a href="https://github.com" class="btn" target="_blank" rel="noopener">Перейти на GitHub</a>
  </main>

</body>
</html>
